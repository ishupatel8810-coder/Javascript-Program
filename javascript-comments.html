<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Comments</h2>

<p id="demo"></p>

<script>
// This is a single-line comment

let x = 5;  // Declare x and assign 5
let y = 6;  // Declare y and assign 6

// Add x and y
let z = x + y;

document.getElementById("demo").innerHTML = z;
</script>

</body>
</html>
